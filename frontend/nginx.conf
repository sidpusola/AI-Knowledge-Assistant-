server {
    listen 8080;
    root /usr/share/nginx/html;

    # Handouts can be large PDFs.
    client_max_body_size 50m;

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        # The original host: Google sign-in compares it with the redirect
        # URI's host, and the session cookie is scoped to it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Answers stream token by token (Server-Sent Events); buffering
        # would hold them back until the whole answer was written.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri /index.html;
    }
}
